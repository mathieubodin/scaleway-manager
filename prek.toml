# Git hooks run by prek (https://prek.j178.dev). Install once per clone: `prek install`.
# One tool per file type: local hooks call the same make targets as CI.
# JSON and trailing whitespace are left to Biome and markdownlint.
exclude = { glob = [".claude/skills/bmad-*/**", "_bmad/**"] }

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-yaml", args = ["--allow-multiple-documents"] },
    { id = "check-toml" },
    { id = "mixed-line-ending", args = ["--fix", "lf"] },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "fix-docs", name = "Markdown lint", entry = "make fix-docs", language = "system", files = "\\.md$", pass_filenames = false },
    { id = "check-frozen", name = "Frozen tests", entry = "make check-frozen", language = "system", pass_filenames = false, always_run = true },
]
