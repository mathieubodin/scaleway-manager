suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: scaleway-manager
set:
  httpRoute:
    gateway:
      name: gw
      namespace: gw-ns
tests:
  - it: renders one dedicated ServiceAccount named scaleway-manager
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: scaleway-manager

  - it: does not mount the service account token
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: carries the common labels
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: scaleway-manager-0.0.0
            app.kubernetes.io/name: scaleway-manager
            app.kubernetes.io/instance: scaleway-manager
            app.kubernetes.io/version: "0.0.0"
            app.kubernetes.io/managed-by: Helm

  - it: follows the standard Helm fullname rule for another release name
    release:
      name: demo
    asserts:
      - equal:
          path: metadata.name
          value: demo-scaleway-manager

  - it: uses the release name alone when it contains the chart name
    release:
      name: scaleway-manager-prod
    asserts:
      - equal:
          path: metadata.name
          value: scaleway-manager-prod
