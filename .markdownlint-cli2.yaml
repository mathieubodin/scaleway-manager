# Markdown lint for every file written for this project.
# Excluded: files of the BMad modules (core, bmm, bmb), overwritten on each install.
# Checks only by default; `make fix-docs` passes --fix.
gitignore: true
noBanner: true
noProgress: true
globs:
  - "**/*.md"
ignores:
  - ".claude/skills/bmad-*/**"
  - "_bmad/**"
config:
  # One paragraph per line is allowed: BMad skills write that way and --fix cannot wrap.
  MD013: false
  # .memlog.md files start with front matter then a list, a format set by BMad skills.
  MD041: false
  MD001:
    front_matter_title: ""
  MD024:
    siblings_only: true
  MD025:
    front_matter_title: ""
